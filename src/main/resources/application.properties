spring.application.name=dispatch

# =============================================================================
# Kafka Configuration
# =============================================================================
# Bootstrap server: override with SPRING_KAFKA_BOOTSTRAP_SERVERS env var for
# non-local environments (e.g., Docker, CI, production).
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---- Producer settings ----
# Wait for acknowledgement from all in-sync replicas before confirming send.
# This ensures the REST layer only returns 202 after the broker has durably
# received the message (at least for single-broker local setups).
spring.kafka.producer.acks=all
# Retry transient send failures up to 3 times before surfacing an exception.
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Include type information in the message header so consumers can deserialize
# to the correct DTO type without hard-coding class names in topic config.
spring.kafka.producer.properties.spring.json.add.type.headers=true

# ---- Consumer settings ----
spring.kafka.consumer.group-id=dispatch-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust the com.aagosh.dispatch.api package for JSON deserialization.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.aagosh.dispatch.api
# Disable auto-commit so that offset is committed only after successful processing.
spring.kafka.consumer.enable-auto-commit=false
# Use MANUAL_IMMEDIATE acknowledgement mode (configured in KafkaConfig bean).

# ---- Topic names (referenced as constants from KafkaTopics) ----
dispatch.kafka.topics.driver-pings=driver-pings
dispatch.kafka.topics.ride-requests=ride-requests

# =============================================================================
# PostgreSQL DataSource (Phase 5 Step 2)
# =============================================================================
# Connection targets the docker-compose postgres service by default.
# Override with environment variables for non-local environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dispatch_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dispatch_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dispatch_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
# PostgreSQL dialect is auto-detected by Hibernate; set explicitly for clarity.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Never auto-generate or auto-drop schema — Flyway owns the schema lifecycle.
spring.jpa.hibernate.ddl-auto=validate
# Useful for debugging; disable or set to false in production.
spring.jpa.show-sql=false

# =============================================================================
# Flyway
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
