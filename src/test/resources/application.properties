spring.application.name=dispatch-test

# Kafka test configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dispatch-service

# Prevent listener containers from auto-starting and attempting connection
# loops to a non-existent local broker during unit and context tests.
spring.kafka.listener.auto-startup=false

# Topic names
dispatch.kafka.topics.driver-pings=driver-pings
dispatch.kafka.topics.ride-requests=ride-requests
