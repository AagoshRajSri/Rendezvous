spring.application.name=dispatch-test

# Kafka test configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dispatch-service

# Prevent listener containers from auto-starting and attempting connection
# loops to a non-existent local broker during unit and context tests.
spring.kafka.listener.auto-startup=false

# Topic names
dispatch.kafka.topics.driver-pings=driver-pings
dispatch.kafka.topics.ride-requests=ride-requests

# =============================================================================
# Observability & Metrics (Phase 9)
# =============================================================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true

management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.shutdown.enabled=false

management.metrics.tags.application=dispatch
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=40ms,80ms,150ms,250ms
