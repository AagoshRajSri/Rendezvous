<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#151d2a" />
      <stop offset="100%" stop-color="#070a0f" />
    </radialGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="42" cy="44" r="14" fill="#10b981" opacity="0.25" filter="url(#emeraldGlow)" />
  
  <!-- Rendezvous Geometric 'R' Motif -->
  <g transform="translate(10, 10) scale(1.375)">
    <!-- Vertical Pillar -->
    <rect x="4" y="5" width="4" height="22" rx="2" fill="#ffffff" />
    <!-- Curved Upper Loop -->
    <path
      d="M8 7 H19 C23.5 7 26.5 10 26.5 14 C26.5 18 23.5 21 19 21 H8"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Kinetic Dispatch Diagonal Pathway -->
    <path
      d="M17 19 L26.5 27"
      stroke="#10b981"
      stroke-width="3.5"
      stroke-linecap="round"
      filter="url(#emeraldGlow)"
    />
    <!-- Nexus Node -->
    <circle cx="26.5" cy="27" r="2.5" fill="#34d399" filter="url(#emeraldGlow)" />
  </g>
</svg>
