<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded Obsidian Container for high tab contrast -->
  <rect width="32" height="32" rx="7" fill="#090d16" />
  
  <!-- Subtle inner border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#1e293b" stroke-opacity="0.6" />

  <!-- Rendezvous 'R' Geometric Dispatch Route Mark -->
  <g transform="translate(2.5, 2.5) scale(0.85)">
    <!-- Vertical Pillar -->
    <rect x="4" y="5" width="4.5" height="22" rx="2.25" fill="#ffffff" />
    <!-- Loop -->
    <path
      d="M8.5 7.5 H19 C23.5 7.5 26.5 10.5 26.5 14.5 C26.5 18.5 23.5 21.5 19 21.5 H8.5"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Emerald Dispatch Pathway -->
    <path
      d="M17 19.5 L26 27"
      stroke="#10b981"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- Destination Nexus Pin -->
    <circle cx="26" cy="27" r="2.5" fill="#34d399" />
  </g>
</svg>