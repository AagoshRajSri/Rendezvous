# =============================================================================
# Architectural Services
# =============================================================================
# In Phase 5, Kafka is used for asynchronous event ingestion of driver
# location telemetry and ride requests.
#
# In Phase 5 Step 2, PostgreSQL is active for durable ride request and assignment
# persistence via Spring Data JPA and Flyway.
#
# Redis remains a blueprint stub for future distributed caching / spatial pub-sub.
# =============================================================================

services:
  # Phase 5 Step 2: Durable ride request & assignment storage
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: dispatch_password
      POSTGRES_DB: dispatch_db
    ports:
      - "5432:5432"

  # Declared for future distributed caching / spatial pub-sub (currently unused)
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  # Asynchronous telemetry & ride event streaming (Phase 5)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0