# =============================================================================
# Architectural Services — Declared for Future Integration
# =============================================================================
# IMPORTANT NOTICE:
# The current dispatch matching service operates strictly as an in-memory,
# thread-safe domain engine. The services declared below (PostgreSQL, Redis,
# and Kafka) are blueprint stubs for future milestones (persistence, distributed
# caching, and event streaming) and are CURRENTLY UNUSED by the application.
# =============================================================================

services:
  # Declared for future persistent driver and ride storage (currently unused)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: dispatch_password
      POSTGRES_DB: dispatch_db
    ports:
      - "5432:5432"

  # Declared for future distributed caching / spatial pub-sub (currently unused)
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  # Declared for future asynchronous telemetry & ride event streaming (currently unused)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093