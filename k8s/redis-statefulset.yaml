# =============================================================================
# Redis 7 — StatefulSet + PVC + ClusterIP Service
# =============================================================================
# Configured with:
#   - AOF persistence for crash recovery
#   - 256 MB maxmemory with volatile-lru eviction (non-authoritative cache)
#   - PVC for /data so AOF survives pod restarts
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: rendezvous
  labels:
    app: redis
    tier: cache
data:
  # redis.conf passed via command args; adjust if you prefer a ConfigMap volume mount
  REDIS_MAXMEMORY: "256mb"
  REDIS_MAXMEMORY_POLICY: "volatile-lru"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: rendezvous
  labels:
    app: redis
    tier: cache
    version: "7"
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - volatile-lru
            - --save
            - "60 1"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: rendezvous
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
# ClusterIP service — backend connects to redis:6379
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rendezvous
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
