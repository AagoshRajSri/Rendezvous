# =============================================================================
# Rendezvous Spring Boot Backend — Deployment + NodePort Service
# =============================================================================
# Uses secrets for DB/Redis credentials and config map for tunable properties.
# Liveness and readiness probes use Spring Boot Actuator health endpoints.
# Resource requests/limits are tuned for the in-memory DriverRegistry workload.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: rendezvous
  labels:
    app.kubernetes.io/name: rendezvous
    app.kubernetes.io/part-of: rendezvous-dispatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rendezvous-config
  namespace: rendezvous
  labels:
    app: rendezvous
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dispatch_db?options=-c%20timezone=UTC"
  SPRING_DATASOURCE_USERNAME: "dispatch_user"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_PASSWORD: ""
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"
  DISPATCH_MATCHING_DRIVER_STALENESS_SECONDS: "60"
  # Exponential backoff DLQ config (referenced by KafkaConfig)
  DISPATCH_KAFKA_DLQ_TOPIC: "dispatch-failures-dlq"
  DISPATCH_KAFKA_RETRY_MAX_ATTEMPTS: "3"
  DISPATCH_KAFKA_RETRY_INITIAL_INTERVAL_MS: "1000"
  DISPATCH_KAFKA_RETRY_MULTIPLIER: "2.0"
  DISPATCH_KAFKA_RETRY_MAX_INTERVAL_MS: "10000"
---
apiVersion: v1
kind: Secret
metadata:
  name: rendezvous-secret
  namespace: rendezvous
  labels:
    app: rendezvous
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "dispatch_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rendezvous
  namespace: rendezvous
  labels:
    app: rendezvous
    tier: backend
    version: "latest"
spec:
  # Initial replica count; HPA will override this dynamically.
  replicas: 2
  selector:
    matchLabels:
      app: rendezvous
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below 1 pod during an upgrade; avoids full outage.
      maxUnavailable: 1
      # Allow 1 extra pod during rollout to maintain capacity.
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rendezvous
        tier: backend
      annotations:
        # Forces Prometheus to scrape this pod directly. The actuator/prometheus
        # endpoint is on port 8080 at /actuator/prometheus.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 60
      # Wait for stateful dependencies before scheduling pods.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL at postgres:5432..."
                sleep 2
              done
              echo "PostgreSQL is reachable."
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka at kafka:9092..."
                sleep 2
              done
              echo "Kafka is reachable."
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis at redis:6379..."
                sleep 2
              done
              echo "Redis is reachable."
      containers:
        - name: rendezvous
          # Build and push your image to a registry, then update this tag.
          # Example: docker build -t rendezvous:latest . && kind load docker-image rendezvous:latest
          image: rendezvous:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: rendezvous-config
            - secretRef:
                name: rendezvous-secret
          resources:
            requests:
              # Enough for JVM baseline + DriverRegistry in-memory footprint
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          # Readiness: pod receives traffic only when Spring context is fully loaded
          # and all Flyway migrations have completed.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          # Liveness: restart pod if it becomes deadlocked or OOM-killed.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          # Startup probe: allows up to 3 minutes for initial Flyway + JIT warmup.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          lifecycle:
            preStop:
              exec:
                # Give the JVM time to drain in-flight Kafka consumers before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 10"]
---
# NodePort service exposes the API externally on port 30080 for local Minikube access.
# For cloud environments, switch type to LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: rendezvous
  namespace: rendezvous
  labels:
    app: rendezvous
    tier: backend
spec:
  type: NodePort
  selector:
    app: rendezvous
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
